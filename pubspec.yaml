name: budget_app
description: A premium Flutter budget tracking app with modern UI and smooth animations.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # ---- Firebase ----
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_storage: ^12.3.2

  # Local notifications (display FCM payloads in foreground)
  flutter_local_notifications: ^17.2.3

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  # UI / Animation
  flutter_animate: ^4.5.2
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1
  cached_network_image: ^3.4.0
  shimmer: ^4.0.0
  fl_chart: ^1.2.0
  lottie: ^3.3.0
  smooth_page_indicator: ^3.0.0
  flutter_staggered_animations: ^1.1.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.4.2
  shared_preferences: ^2.3.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Inter Tight
      fonts:
        - asset: assets/fonts/InterTight.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
