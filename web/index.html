<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="budget_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      background-color: #0F1015;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      color: white;
      font: 600 22px/28px Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: -.4px;
      pointer-events: none;
    }
    #boot-logo { width: 96px; height: 96px; border-radius: 28px; display: grid;
      place-items: center; background: linear-gradient(135deg, #227A67, #36977C);
      animation: pulse 1.4s ease-in-out infinite alternate; }
    #boot-dots { display: flex; gap: 6px; }
    #boot-dots span { width: 6px; height: 6px; border-radius: 50%; background: currentColor;
      animation: dot 1s ease-in-out infinite alternate; }
    #boot-dots span:nth-child(2) { animation-delay: .15s; }
    #boot-dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes pulse { to { transform: scale(1.05); } }
    @keyframes dot { from { opacity: .35; } to { opacity: 1; transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) {
      #boot-logo, #boot-dots span { animation: none; }
    }
  </style>

  <title>budget_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="boot" aria-label="Loading Budget"><div id="boot-logo" aria-hidden="true">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="white"><path d="M20 4H4C2.9 4 2 4.9 2 6v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zm-3-7h3v4h-3c-1.1 0-2-.9-2-2s.9-2 2-2z"/></svg>
  </div><div>Budget</div>
    <div id="boot-dots"><span></span><span></span><span></span></div></div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Automatically launch application when DDC modules finish loading in regular browsers
    (function poll() {
      if (typeof window.$dartRunMain === 'function' && !window.$dartMainExecuted) {
        window.$dartRunMain();
      } else {
        setTimeout(poll, 50);
      }
    })();
  </script>
</body>
</html>
